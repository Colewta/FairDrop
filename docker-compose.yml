services:
  backend:
    build: ./Backend
    environment:
      FAIRDROP_API_TOKEN: "${FAIRDROP_API_TOKEN:-}"
      FAIRDROP_INSTITUTION_ID: "${FAIRDROP_INSTITUTION_ID:-local}"
      FRONTEND_ORIGINS: "http://localhost:${FAIRDROP_FRONTEND_PORT:-5173},http://127.0.0.1:${FAIRDROP_FRONTEND_PORT:-5173}"
    volumes:
      - fairdrop_data:/app/data/platform
    ports:
      - "127.0.0.1:${FAIRDROP_BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    restart: unless-stopped
  frontend:
    image: node:22-alpine
    working_dir: /app
    environment:
      NODE_ENV: development
      # A URL é acessada pelo navegador no computador, não pela rede do Docker.
      VITE_API_URL: "http://localhost:${FAIRDROP_BACKEND_PORT:-8000}"
    volumes:
      - ./Frontend:/app
      - frontend_node_modules:/app/node_modules
    # --host permite acessar o Vite fora do contêiner. As dependências ficam no volume.
    command: ["sh", "-c", "npm install && exec npm run dev -- --host 0.0.0.0 --port 5173 --strictPort"]
    ports:
      - "127.0.0.1:${FAIRDROP_FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 8
    restart: unless-stopped
volumes:
  fairdrop_data:
  frontend_node_modules:
